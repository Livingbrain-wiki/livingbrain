# The Living Brain workspace: one Rust Cargo workspace consumed as a
# Cratefield venture and deployed as a single Cloudflare Worker.
#
# Two kinds of crate, and the split is a rule: `crates/livingbrain-*` are
# modules that depend on Cratefield ports (`cratefield-core`) and never on a
# runtime or a vendor SDK (a module that names `worker` fails CI's wasm-safety
# check); `crates/livingbrain-venture` is the Worker, the composition root and
# the only crate that names `worker` and `cratefield-runtime-cloudflare`.
# `crates/livingbrain-cli` is neither: it is the native `livingbrain` client
# binary, a client of the API that is never a dependency of the Worker.
#
# Harness crates come from crates.io, every `cratefield-*` pinned exactly to
# one release round (harness docs/COMPATIBILITY.md: ventures pin exact
# versions), so they all resolve to the same `cratefield-core`: two copies of
# core in one graph is a type error, not a version skew. Move them together.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Livingbrain-wiki/livingbrain"

[workspace.dependencies]
# Harness, from crates.io (see the note above). `cratefield-core` is the ports-only
# crate every module depends on; `runtime-cloudflare` is the Worker's runtime and
# `testing` is the test double, neither of which a module names.
cratefield-core = "=0.8.0"
cratefield-runtime-cloudflare = "=0.4.0"
cratefield-testing = "=0.5.0"

# The mail round (issue #63): `module-waitlist` ships the confirm mails,
# `mail-templates` renders them in this venture's theme, and `adapter-owlpost`
# is the `Mailer` port. Pinned to the same release round as the rest, so every
# one of them resolves to the single `cratefield-core` above.
cratefield-adapter-owlpost = "=0.2.0"
cratefield-mail-templates = "=0.1.0"
cratefield-module-waitlist = "=0.4.0"
# The device authorization grant (issue #72): the codes, the approval page
# and the polling state machine for a client with no browser. This venture
# supplies the two hooks — who may approve, and what a credential is.
cratefield-module-device-auth = "=0.3.0"
# The two classifiers the judge thresholds for (issue #53): the
# purpose-trained one (`Calibration::Classifier`) and the language-model
# fallback over a `TextModel` (`Calibration::LanguageModel`). Dev-only here,
# in the judge's test that proves the family mapping against the real
# adapters; the venture is what wires either of them.
cratefield-adapter-classifier-llm = "=0.3.0"
cratefield-adapter-typesafe = "=0.3.0"
# The KMS port: the only thing the page store asks of a key custodian is
# wrap and unwrap a data key (issue #43). It has no dependency on
# `cratefield-core` at all, so it cannot pull a second copy of the ports in.
cratefield-kms = "=0.2.0"
# Turnstile, the captcha on the waitlist's public join form (issue #23).
cratefield-adapter-turnstile = "=0.3.0"

# The Workers SDK, pinned to the version the runtime crate targets. Only the
# venture crate names it.
worker = { version = "0.8.5", default-features = false, features = ["d1"] }

# `wasm_js` is what makes `getrandom` work in a Workers isolate; the venture
# crate pulls it for the wasm32 target only.
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }

# Non-harness crates a module names directly. All pure Rust and wasm-safe;
# CI's wasm job and each module's `assert_wasm_safe_deps` keep it that way.
# Pinned to the versions the harness already resolves, so they add no new
# entry to the lockfile beyond the one the module itself needs.
async-trait = "0.1.92"
# `base64` is the version `cratefield-core` already resolves, so naming it adds
# no new lockfile entry. `alloc` only: a Worker has no `std`, and this crate is
# wasm-safe by construction.
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
bytes = "1.12.1"
# The page store's cipher (issue #43): XChaCha20-Poly1305, `alloc` only, safe
# with random 24-byte nonces. It is the cipher the harness's own KMS port
# (`cratefield-kms`) seals with, so there is one cipher in the graph and one
# set of constants to reason about.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# The blind index (issue #43): `HMAC-SHA256` over a key derived from the scope
# DEK. Both are the `0.12`/`0.10` pair the tree already resolves. `sha2` is
# also the SHA-256 of a sign-in token, so only the hash of a magic link is
# stored (issue #71).
hmac = "0.12.1"
sha2 = "0.10.9"
# Wipes the derived blind-index key when the call that needed it is over, the
# way `cratefield-kms` wipes a DEK.
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
# The `import markdown` walk (issue #81): `.gitignore`-aware, hidden-skipping
# directory traversal with `--exclude` globs. Native-only, and named here for
# the resolution it already needs: only the CLI depends on it, never a module,
# so it stays out of the Worker's wasm graph.
ignore = "0.4.23"
# The chat export reader (issue #49): `import chatgpt` / `import claude` read
# `conversations.json` straight out of the export zip, in memory, never
# extracted to disk. Native-only like `ignore` above — only the CLI names it,
# never a module. `deflate` only: an export zip stores or deflates, and the
# test suite builds its fixtures with the same feature set.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
# The URL-encoding `axum` and `url` already resolve.
percent-encoding = "2.3"
pollster = { version = "0.4", features = ["macro"] }
sea-query = { version = "0.32.7", default-features = false, features = ["thread-safe", "backend-sqlite"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.45", default-features = false, features = ["std", "formatting"] }
tower = { version = "0.5.3", features = ["util"] }

# Snapshot tests for the venture's branded mail (issue #63). Dev-only; pinned
# like the rest so the workspace resolves one `insta`.
insta = "1.49.0"

# Property tests, dev-only in both crates that use them: the blind-index scope
# property test (issue #43) and the access model's permission invariants
# (issue #8). Dev-only, so proptest's tree never reaches a module's wasm graph.
proptest = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"

# Test binaries are enormous — the largest are 120-147 MB, almost all of it DWARF.
# `line-tables-only` keeps the file and line for a panic and a backtrace while
# dropping ~1.7 GB from a cold `cargo test --workspace` (4.1 GB -> 2.4 GB here),
# which is what makes the full suite fit on a small CI runner. `debug = 0` would
# save a little more and cost every test failure its line number, which is not a
# trade worth making.
[profile.dev]
debug = "line-tables-only"

# The test profile inherits from `dev`; setting it here as well so the setting
# survives anything that changes the dev profile above it.
[profile.test]
debug = "line-tables-only"
