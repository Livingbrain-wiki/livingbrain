# The Living Brain workspace: one Rust Cargo workspace consumed as a
# Cratefield venture and deployed as a single Cloudflare Worker.
#
# Two kinds of crate, and the split is a rule: `crates/livingbrain-*` are
# modules that depend on Cratefield ports (`cratefield-core`) and never on a
# runtime or a vendor SDK (a module that names `worker` fails CI's wasm-safety
# check); `crates/livingbrain-venture` is the Worker, the composition root and
# the only crate that names `worker` and `cratefield-runtime-cloudflare`.
#
# Harness crates come from git, not crates.io, until the 0.5 release round
# (Cratefield/harness#464). No `rev` on the git deps on purpose: the committed
# `Cargo.lock`, which records the resolved commit, is where the pin lives.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Livingbrain-wiki/livingbrain"

[workspace.dependencies]
# Harness, by git (see the note above). `cratefield-core` is the ports-only
# crate every module depends on; the other two are dev/test and runtime and
# must not appear in a module's normal dependency tree.
cratefield-core = { git = "https://github.com/Cratefield/harness" }
cratefield-runtime-cloudflare = { git = "https://github.com/Cratefield/harness" }
cratefield-testing = { git = "https://github.com/Cratefield/harness" }

# The early-access waitlist (issue #23): the harness `waitlist` module and the
# two adapters it is wired to — Owlpost for the Resend-compatible double
# opt-in mail, Turnstile for the captcha on the public join form. Same git pin
# as the crates above; only the venture crate names them.
cratefield-module-waitlist = { git = "https://github.com/Cratefield/harness" }
cratefield-adapter-owlpost = { git = "https://github.com/Cratefield/harness" }
cratefield-adapter-turnstile = { git = "https://github.com/Cratefield/harness" }

# The Workers SDK, pinned to the version the runtime crate targets. Only the
# venture crate names it.
worker = { version = "0.8.5", default-features = false, features = ["d1"] }

# `wasm_js` is what makes `getrandom` work in a Workers isolate; the venture
# crate pulls it for the wasm32 target only.
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }

# `#[pollster::test]`, the async test attribute `cratefield-testing` uses.
# Dev-only: it must never reach a crate's normal (wasm) dependency graph.
pollster = "0.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"
