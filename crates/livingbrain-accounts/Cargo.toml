# Living Brain modules: agent accounts and their API keys, access grants, and
# the audit log (ADR 0004). The engine — service accounts, the grants rule,
# the audit table — is the harness's `cratefield-module-orgs`; these modules
# are the routes, the rules about who may do what here, and the wiring onto
# Living Brain's own identity (its session cookie and member roles).

[package]
name = "livingbrain-accounts"
description = "Living Brain modules: agent accounts, access grants and the audit log"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**/*"]

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
# Service accounts, grants and audit: library functions over the `Database`
# port and the migrations this crate applies. Wasm-safe.
cratefield-module-orgs = { workspace = true }
# Who is calling: the session cookie, resolved by the tokens module's one
# `session` (members only — an agent never has one).
livingbrain-tokens = { path = "../livingbrain-tokens" }
# Members and roles: whether a principal named in a grant exists.
livingbrain-workspaces = { path = "../livingbrain-workspaces" }
# The grants plan and the space → page-scope rule.
livingbrain-pages = { path = "../livingbrain-pages" }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

[dev-dependencies]
# The session-only modules beside the access ones, so a test can prove an
# agent key reaches none of their routes (ADR 0004).
livingbrain-models = { path = "../livingbrain-models" }
livingbrain-usage = { path = "../livingbrain-usage" }
cratefield-testing = { workspace = true, features = ["postgres"] }
pollster = { workspace = true }
tower = { workspace = true }
sea-query = { workspace = true }
