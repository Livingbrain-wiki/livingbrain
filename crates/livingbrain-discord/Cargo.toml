[package]
name = "livingbrain-discord"
description = "Living Brain module: a Discord server connected by a bot (state, connections, channels, backfill and live polling) that files each channel-day as a source"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**/*", "migrations/**/*"]

[lints]
workspace = true

[dependencies]
cratefield-core = { workspace = true }
# D1's bound-parameter ceiling and the helpers that keep a statement under it.
livingbrain-d1 = { path = "../livingbrain-d1" }
cratefield-kms = { workspace = true }
# Single-use states are stored as their SHA-256; nonces come from the OS source.
sha2 = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
sea-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

# Who may connect or change a server is decided by the workspaces module's own
# membership read, re-read at the moment of the write.
livingbrain-workspaces = { path = "../livingbrain-workspaces" }
livingbrain-tokens = { path = "../livingbrain-tokens" }
# The one ingest pipeline every import shares: screen, redact, dedupe, seal.
livingbrain-pages = { path = "../livingbrain-pages" }
livingbrain-access = { path = "../livingbrain-access" }

[dev-dependencies]
# D1's bind ceiling as a test double. Dev-only.
livingbrain-d1-fake = { path = "../livingbrain-d1-fake" }
cratefield-testing = { workspace = true, features = ["postgres"] }
pollster = { workspace = true }
tower = { workspace = true }
async-trait = { workspace = true }
