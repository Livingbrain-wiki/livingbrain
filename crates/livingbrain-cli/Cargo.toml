[package]
name = "livingbrain-cli"
description = "The `livingbrain` CLI: a native client of the Living Brain API. Not a module — it holds no memory and runs no agent loop; the server does."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "livingbrain"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1"
# Blocking HTTP, rustls only: no OpenSSL, and static-musl friendly.
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
# The OS keychain, never a file. `linux-native` is the kernel keyutils backend:
# pure Rust, no D-Bus or OpenSSL system libraries. The other two are inert here.
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
# What leaves a machine, and the switch that decides whether it does. A plain
# library with no HTTP client, no clock and no RNG of its own, so the CLI keeps
# the only network client it has (`ureq`) and the only source of randomness it
# has (std's `RandomState`) — both named in `src/telemetry.rs`. A path dep
# because this crate is native-only and is never in the Worker's graph.
livingbrain-telemetry = { path = "../livingbrain-telemetry" }
# The vendored "Built with" list (issue #61): pure data and two renderers, so
# `livingbrain about` works before anyone has logged in.
livingbrain-stack = { path = "../livingbrain-stack" }
# The directory walk behind `import markdown` (issue #81): `.gitignore` and
# hidden files respected, `--exclude` globs applied as ignore overrides.
ignore = { workspace = true }
# What leaves a machine. Run here, on the file, before the body is built, so a
# secret in a vault never crosses the socket — the server runs the same library
# on every ingest path, so the thing that decides what is stored stays one
# piece of code.
livingbrain-redact = { path = "../livingbrain-redact" }

[dev-dependencies]
# The import test's mock keys "already imported?" on the body's SHA-256, the
# same idempotency key the server uses. The lockfile already resolves `sha2`.
sha2 = { workspace = true }
