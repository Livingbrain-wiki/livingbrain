[package]
name = "livingbrain-pages"
description = "The Living Brain pages module: versioned entities (person, project, decision, customer, system, glossary) with Markdown bodies in R2 and metadata in D1"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The only Cratefield dependencies a module is allowed: the ports, and the
# KMS port beside them. `axum` arrives through `cratefield_core::axum`, so it
# is not named directly.
cratefield-core = { workspace = true }
# Wrap/unwrap a scope's data key (issue #43). A harness port, like the ones
# above, and it names no `cratefield-core` — so it cannot split the ports in
# two.
cratefield-kms = { workspace = true }
# Access grants (ADR 0004): the deny-by-default engine `access::AccessPlan`
# evaluates, and the table its grants are read from. A harness module crate,
# pure Rust and wasm-safe; its routes are not mounted here.
cratefield-module-orgs = { workspace = true }
# The access model: this module owns which page scope a scope maps to and
# which scopes an asker may read (issue #123), so it asks the model rather
# than reimplementing the rule. Pure Rust, wasm-safe.
livingbrain-access = { path = "../livingbrain-access" }
# D1's bound-parameter ceiling and the helpers that keep every statement
# under it (the group budget, the `?` lists).
livingbrain-d1 = { path = "../livingbrain-d1" }
# Redaction, so a question carrying a secret is cleaned before it becomes a
# search query (issue #108).
livingbrain-redact = { path = "../livingbrain-redact" }
# The temporal-facts model (docs/temporal-facts.md): partial dates, the
# deterministic timeline resolution and its renderings. Pure Rust, no I/O,
# wasm-safe; the fact store here is its storage half.
livingbrain-memory = { path = "../livingbrain-memory" }
# `Answers` is an `async` trait a sibling module holds as `dyn`, which needs
# the attribute macro to be object-safe. Already in the tree.
async-trait = { workspace = true }
# `sea_query::Value` is what a `Statement` binds, and `time` formats the
# version timestamps — neither is re-exported by `cratefield-core`. Both are
# pure Rust, already in the tree and wasm-safe (a module's wasm build is
# checked by CI's worker-build job and the conformance suite).
sea-query = { version = "0.32", default-features = false, features = ["backend-sqlite", "thread-safe"] }
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
# The `wikilinks` column of the source ledger (issue #81) is a JSON array, so
# the store both writes it and reads it back with the same crate every other
# module already depends on. Pure Rust, no `std::fs`, wasm-safe as above.
serde_json = { workspace = true }

# Envelope encryption for page bodies and the blind index (issue #43), all
# pinned to the versions the harness already resolves.
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# The `postgres` feature unlocks the Postgres leg of the conformance suite
# (issue #20). Dev-only, so sqlx and tokio never reach the module's wasm graph.
cratefield-testing = { workspace = true, features = ["postgres"] }
# `common`'s recording fakes implement the `Blob` and `Database` ports, and
# those ports are declared with `async_trait`. It is already in the tree.
async-trait = { workspace = true }
# The blind-index scope property test (issue #43). Dev-only.
proptest = { workspace = true }
# An executor for the store's async tests, the same one the harness's own
# module suites use. Dev-only, so it never reaches the module's dependency
# tree either.
pollster = "0.4"
# D1's bind ceiling as a test double (the wrapper over the real SQLite
# database, and the fake the graph test drives). Dev-only.
livingbrain-d1-fake = { path = "../livingbrain-d1-fake" }
