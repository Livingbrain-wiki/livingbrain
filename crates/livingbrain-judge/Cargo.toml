[package]
name = "livingbrain-judge"
description = "Triage, the memory gate and the contradiction check: typed question sets, per-calibration thresholds, and an event-log record that carries no text"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# A plain library, not a Cratefield module: no tables, no routes, no Module.
# It names `cratefield-core` for the `Classifier` port it is an implementation
# of, and nothing else — no runtime, no vendor SDK — so a module crate can
# compose it and the Worker can link it.
[dependencies]
cratefield-core = { workspace = true }
# `serde` so a future per-workspace settings row stores `JudgeSettings` as
# JSON; `serde_json` only for the event payload in the tests.
serde = { workspace = true }

[dev-dependencies]
# The fake that records every ask and answers with the probabilities a test
# scripts. `pollster` is how the workspace drives a future from `#[test]`.
cratefield-testing = { workspace = true }
# Only the test double in `judge.rs` implements the port by hand.
async-trait = { workspace = true }
pollster = { workspace = true }
serde_json = { workspace = true }
# `FixedClock` takes one, so the TypeSafe adapter can be constructed here.
time = { workspace = true }
# The two real adapters, so the family mapping is proven against them rather
# than against a fake that agrees with whatever the crate assumes.
cratefield-adapter-typesafe = { workspace = true }
cratefield-adapter-classifier-llm = { workspace = true }