[package]
name = "livingbrain-venture"
description = "The Living Brain Worker: the composition root that mounts every livingbrain module and serves it on Cloudflare"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `cdylib` for worker-build's wasm output; `rlib` so the harness can be built
# and inspected from a native test.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# This is the one crate allowed to name a runtime and a vendor SDK. Modules
# depend on `cratefield-core` only; see the root Cargo.toml.
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true }
# The mail round (issue #63): `mail-templates` renders mail in the theme beside
# this crate and Owlpost is the `Mailer` port the runtime holds.
cratefield-adapter-owlpost = { workspace = true }
cratefield-mail-templates = { workspace = true }
# The waitlist (issue #23): the harness module and the Turnstile captcha
# adapter on its join form. The venture, not a module, names them.
cratefield-module-waitlist = { workspace = true }
cratefield-adapter-turnstile = { workspace = true }
# The device authorization grant (issue #72): the codes, the approval page
# and the polling state machine, for a client with no browser. The venture
# supplies its two hooks — who may approve, and what a credential is.
cratefield-module-device-auth = { workspace = true }
# The MCP server (issue #24) seals and opens page bodies through the same key
# custodian `cratefield-kms` serves the page store; the harness has no `Kms`
# port, so the composition builds it and hands it to the module.
cratefield-kms = { workspace = true }
# `TokenBearer` below implements the module's `BearerAuth` seam.
async-trait = { workspace = true }
livingbrain-canary = { path = "../livingbrain-canary" }
livingbrain-mcp = { path = "../livingbrain-mcp" }
livingbrain-models = { path = "../livingbrain-models" }
livingbrain-pages = { path = "../livingbrain-pages" }
livingbrain-tokens = { path = "../livingbrain-tokens" }
livingbrain-workspaces = { path = "../livingbrain-workspaces" }
worker = { workspace = true }
# The entropy source the device grant draws its codes from (issue #72).
# `wasm_js` is what makes it work in a Workers isolate; on a native build it
# is the operating system's.
getrandom = { workspace = true }

[dev-dependencies]
# The fake HTTP client the Owlpost test records a send with, the snapshot tool
# for the rendered mail layouts, `serde_json` for the sample data and the
# recorded body, and the block-on the async tests need. The waitlist test
# mounts the venture's composition over the kit's fakes and an in-memory
# SQLite database. Dev-only: none of them reach the wasm graph.
cratefield-testing = { workspace = true }
insta = { workspace = true }
pollster = { workspace = true }
serde_json = { workspace = true }
