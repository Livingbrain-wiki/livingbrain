[package]
name = "livingbrain-venture"
description = "The Living Brain Worker: the composition root that mounts every livingbrain module and serves it on Cloudflare"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `cdylib` for worker-build's wasm output; `rlib` so the harness can be built
# and inspected from a native test.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# This is the one crate allowed to name a runtime and a vendor SDK. Modules
# depend on `cratefield-core` only; see the root Cargo.toml.
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true }
# The waitlist (issue #23): the harness module plus the Owlpost mail and
# Turnstile captcha adapters it needs. The venture, not a module, names them.
cratefield-module-waitlist = { workspace = true }
cratefield-adapter-owlpost = { workspace = true }
cratefield-adapter-turnstile = { workspace = true }
livingbrain-canary = { path = "../livingbrain-canary" }
worker = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
# Native-only: mounts the venture's waitlist composition over the kit's fakes
# and an in-memory SQLite database (cratefield-testing's default `harness`
# feature). Never part of the wasm graph.
cratefield-testing = { workspace = true }
pollster = { workspace = true }
