# The Living Brain Worker's Wrangler config, beside the venture crate. Run
# `npx wrangler dev --local` from this directory (npx, so no package.json or
# node_modules lands in the repo). `worker-build` compiles the crate to wasm
# and writes `build/worker/shim.mjs`, the Worker's entry point.
#
# The top-level config is local development and is never deployed. The
# `[env.staging]` and `[env.production]` blocks below are what CI deploys;
# docs/deploy.md is the runbook, including the one-time setup every
# placeholder id here still needs.
name = "livingbrain"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "cargo install -q --locked worker-build && worker-build --release"

[observability]
enabled = true

# The deployment's environment, read by the harness (`EnvConfig`, shared
# secrets-before-vars) to arm the production-only rules: the fail-closed
# captcha gate and the readiness checks. Declared here, not in `src/lib.rs`,
# because `Harness::build` takes no config — a compiled-in production would
# refuse to build rather than serve and say what it is missing (issue #143).
# `ENV` is set in the `[vars]` table below.

# Required Worker secrets, set with `wrangler secret put <NAME>` (names only;
# no values here). `HARNESS_SECRET` is the `Signer` behind the confirm links,
# `OWLPOST_API_KEY` the mailer (absent → joins are captured but nothing sends),
# `TURNSTILE_SECRET` the captcha on the join form, `ADMIN_TOKEN` the CSV
# export.

# Workers Rate Limiting backs the harness's throttle: the waitlist module's
# public join route and the admin floor both consult it, and readiness
# refuses a venture with public writes unless a limiter resolves (issue #437).
# `simple` allows 30 `limit()` calls per key per 60s — the only supported
# shape. The id is a placeholder, as the D1/KV ids above are.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4001"

[ratelimits.simple]
limit = 30
period = 60

# The Worker's own cron. `serve_scheduled` fans a firing out over this
# Worker's modules — the `waitlist` module prunes expired confirmation claims
# on it. A trigger configured on some other Worker never reaches this
# handler, so the cron has to live here or the pass silently never runs.
# Daily, in a quiet hour; the pass is safe at any cadence.
[triggers]
crons = ["19 4 * * *"]

# D1 database `livingbrain`. The id is a PLACEHOLDER: `wrangler dev --local`
# simulates the database and ignores it, so this is enough locally. A real
# deployment needs the id printed by `wrangler d1 create livingbrain`, which
# this scaffold deliberately never runs (it touches a Cloudflare account).
#
# `migrations_dir` is what `wrangler d1 migrations apply livingbrain --local`
# reads. The files there are the collected form of each module's own
# `migrations/` (see crates/livingbrain-workspaces/migrations/) with the
# module and id in the name; `.harness-lock.json` beside them pins each one so
# `fz migrations collect` appends rather than renumbers. Run the apply before
# `wrangler dev` the first time — the runtime never migrates at startup.
[[d1_databases]]
binding = "DB"
database_name = "livingbrain"
database_id = "placeholder-run-wrangler-d1-create-livingbrain"
migrations_dir = "migrations"

# R2 bucket `livingbrain-blobs`, simulated under `--local`.
[[r2_buckets]]
binding = "R2"
bucket_name = "livingbrain-blobs"

# KV namespace; the id is a PLACEHOLDER (`wrangler kv namespace create`).
[[kv_namespaces]]
binding = "KV"
id = "placeholder-run-wrangler-kv-namespace-create"

# Non-secret configuration. Secrets — `HARNESS_SECRET` (which signs every
# cookie this Worker issues), `WORKSPACES_SLACK_CLIENT_SECRET` and
# `OWLPOST_API_KEY` (which sends mail) — belong in `.dev.vars`, which is
# gitignored and deliberately not in this repository; wrangler reads secrets
# before vars, so a name in both resolves to the secret. The Slack client id is
# public (it is in the authorize URL) and the redirect base is the tunnel a
# local run is reached on.
#
# Mail (issue #63). `OWLPOST_API_KEY` is a secret (`wrangler secret put
# OWLPOST_API_KEY`); with it absent or blank the adapter reports `not-configured`
# and sends nothing. `MAIL_FROM` is declared below — the sender must be on a
# domain verified in Owlpost, or sends are refused — and `MAIL_REPLY_TO` is
# optional and left unset until there is an address to reply to. The theme every
# mail renders in is `src/mail-theme.json` beside this file, compiled into the
# Worker. Mail leaves as `multipart/alternative` — HTML and its text twin.
[vars]
ENV = "production"
WORKSPACES_SLACK_CLIENT_ID = "replace-with-your-slack-app-client-id"
# The origin this Worker answers on — under `wrangler dev` that is the
# cloudflared tunnel, because Slack must call the callback back over HTTPS.
WORKSPACES_REDIRECT_BASE = "https://replace-with-your-tunnel.trycloudflare.com"
# The mail sender. The Worker falls back to this same address when the binding
# is absent, so this line documents the default as much as it sets it.
MAIL_FROM = "Living Brain <hello@livingbrain.wiki>"

# ---------------------------------------------------------------------------
# Deployed environments (issue #93). Wrangler does NOT inherit bindings or
# vars into an environment, so each block below repeats the whole set. The
# ids are PLACEHOLDERS of the same kind as the ones above: the owner replaces
# each with the id `wrangler d1 create livingbrain-staging` or
# `wrangler kv namespace create` prints. Secrets are never in this file —
# they are per environment, set with `wrangler secret put <NAME> --env
# staging` (or `production`), which stores them in Cloudflare and not here.
# docs/deploy.md lists the exact set and the GitHub secrets the workflow
# reads. ---------------------------------------------------------------------------

# Staging: every merge to `main`. A failed smoke test rolls this back.
[env.staging]
name = "livingbrain-staging"
compatibility_date = "2026-09-01"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "livingbrain-staging"
database_id = "placeholder-run-wrangler-d1-create-livingbrain-staging"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "livingbrain-blobs-staging"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "placeholder-run-wrangler-kv-namespace-create-staging"

# `ENV` is what the harness reads: it names the deployment environment to the
# production readiness gate and binds every cookie this Worker signs, so a
# token minted in staging never verifies in production. `HARNESS_VENTURE` is
# left unset; set it per environment only if the same `HARNESS_SECRET` is ever
# shared with another venture, which nothing here does.
[env.staging.vars]
ENV = "staging"
WORKSPACES_SLACK_CLIENT_ID = "replace-with-your-slack-app-client-id"
WORKSPACES_REDIRECT_BASE = "https://staging-api.livingbrain.wiki"
MAIL_FROM = "Living Brain <hello@livingbrain.wiki>"

# Production: tags only, and only through the `production` GitHub
# environment's required reviewers (the owner). Same placeholder rule; the
# database and bucket carry no `-staging` suffix.
[env.production]
name = "livingbrain"
compatibility_date = "2026-09-01"

[[env.production.d1_databases]]
binding = "DB"
database_name = "livingbrain"
database_id = "placeholder-run-wrangler-d1-create-livingbrain"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "livingbrain-blobs"

[[env.production.kv_namespaces]]
binding = "KV"
id = "placeholder-run-wrangler-kv-namespace-create"

[env.production.vars]
ENV = "production"
WORKSPACES_SLACK_CLIENT_ID = "replace-with-your-slack-app-client-id"
WORKSPACES_REDIRECT_BASE = "https://api.livingbrain.wiki"
MAIL_FROM = "Living Brain <hello@livingbrain.wiki>"
