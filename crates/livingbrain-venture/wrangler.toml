# The Living Brain Worker's Wrangler config, beside the venture crate. Run
# `npx wrangler dev --local` from this directory (npx, so no package.json or
# node_modules lands in the repo). `worker-build` compiles the crate to wasm
# and writes `build/worker/shim.mjs`, the Worker's entry point.
#
# The top-level config is local development and is never deployed. The
# `[env.staging]` and `[env.production]` blocks below are what CI deploys;
# docs/deploy.md is the runbook, including the one-time setup every
# placeholder id here still needs.
name = "livingbrain"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

# `[build]` is inherited by every environment, so `wrangler deploy` (CI and
# ~/lb-deploy.sh) and `wrangler deploy --dry-run` all run both steps: the
# Worker, then the web app — `tools/stamp-assets.mjs` content-hashes `app/`
# into `../../build/app`, which the environments' `[assets]` serve. Node is
# already here (wrangler is run through npx), and the script needs nothing
# but Node's standard library.
[build]
command = "cargo install -q --locked worker-build && worker-build --release && node ../../tools/stamp-assets.mjs"

[observability]
enabled = true

# The deployment's environment, read by the harness (`EnvConfig`, shared
# secrets-before-vars) to arm the production-only rules: the fail-closed
# captcha gate and the readiness checks. Declared here, not in `src/lib.rs`,
# because `Harness::build` takes no config — a compiled-in production would
# refuse to build rather than serve and say what it is missing (issue #143).
# `ENV` is set in the `[vars]` table below.

# Required Worker secrets, set with `wrangler secret put <NAME>` (names only;
# no values here). `HARNESS_SECRET` is the `Signer` behind the confirm links,
# `OWLPOST_API_KEY` the mailer (absent → joins are captured but nothing sends),
# `TURNSTILE_SECRET` the captcha on the join form, `ADMIN_TOKEN` the CSV
# export.

# Workers Rate Limiting backs the harness's throttle: the waitlist module's
# public join route and the admin floor both consult it, and readiness
# refuses a venture with public writes unless a limiter resolves (issue #437).
# `simple` allows 30 `limit()` calls per key per 60s — the only supported
# shape. The id is a placeholder, as the D1/KV ids above are.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4001"

[ratelimits.simple]
limit = 30
period = 60

# The Worker's own cron. `serve_scheduled` fans a firing out over this
# Worker's modules — the `waitlist` module prunes expired confirmation claims
# on it. A trigger configured on some other Worker never reaches this
# handler, so the cron has to live here or the pass silently never runs.
# Daily, in a quiet hour; the pass is safe at any cadence. The five-minute
# firing drains the `coding-agents` compile queue (up to each workspace's
# `CODING_AGENTS_BATCH` a run) and the GitHub backfill; every module sees
# every firing, and the waitlist's prune is as safe every five minutes as it
# is daily. Sized for Workers Paid (docs/deploy.md, "Scheduled limits"): a
# run may last 15 minutes, so two runs can overlap, and leases keep them off
# the same compile job and the same repository.
#
# Inherited by `[env.staging]` and `[env.production]`, as `[limits]` is.
[triggers]
crons = ["19 4 * * *", "*/5 * * * *"]

# Workers Paid: CPU time per invocation may be raised from the default 30 s
# to 5 minutes. A drain is mostly waiting (model calls, GitHub, D1, R2),
# which is not CPU time, but a busy run parses, redacts, compacts and seals
# dozens of transcripts of up to a megabyte or two in wasm, and that can
# pass 30 s. Cloudflare's limits page lists a Cron Trigger under an hourly
# interval at 30 s of CPU on Paid, whatever this says; the setting is here
# for the HTTP routes (`/v1/coding-agents/process`, `compile-fully`) and for
# whenever the cron is allowed it. Only CPU actually used is billed.
[limits]
cpu_ms = 300_000

# D1 database `livingbrain`. The id is a PLACEHOLDER: `wrangler dev --local`
# simulates the database and ignores it, so this is enough locally. A real
# deployment needs the id printed by `wrangler d1 create livingbrain`, which
# this scaffold deliberately never runs (it touches a Cloudflare account).
#
# `migrations_dir` is what `wrangler d1 migrations apply livingbrain --local`
# reads. The files there are the collected form of each module's own
# `migrations/` (see crates/livingbrain-workspaces/migrations/) with the
# module and id in the name; `.harness-lock.json` beside them pins each one so
# `fz migrations collect` appends rather than renumbers. Run the apply before
# `wrangler dev` the first time — the runtime never migrates at startup.
[[d1_databases]]
binding = "DB"
database_name = "livingbrain"
database_id = "placeholder-run-wrangler-d1-create-livingbrain"
migrations_dir = "migrations"

# R2 bucket `livingbrain-blobs`, simulated under `--local`.
[[r2_buckets]]
binding = "R2"
bucket_name = "livingbrain-blobs"

# KV namespace; the id is a PLACEHOLDER (`wrangler kv namespace create`).
[[kv_namespaces]]
binding = "KV"
id = "placeholder-run-wrangler-kv-namespace-create"

# The per-conversation turn coordinator (issue #7): one Durable Object per
# conversation, keyed by `Message::conversation_key`. workerd runs one
# conversation object's requests one at a time with input gates held, which
# is what serialises the turns of a thread. The class is
# `#[durable_object(fetch)]` in `src/conversation.rs`; `fetch` in `src/lib.rs`
# resolves this binding per request and hands it to the workspaces module's
# turn seam.
[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationObject"

# The class's one-time migration: object storage is SQLite, the only backend
# a new object gets. `[[migrations]]` is one of the few INHERITED keys, so
# this is declared once at the top level — the binding above is not.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationObject"]

# Non-secret configuration. Secrets — `HARNESS_SECRET` (which signs every
# cookie this Worker issues), `WORKSPACES_SLACK_CLIENT_SECRET`,
# `MODEL_KEYS_SECRET` (issue #10: the AES-256-GCM key the `models` module
# encrypts a connected provider key under, SHA-256 of this value) and
# `OWLPOST_API_KEY` (which sends mail) — belong in `.dev.vars`, which is
# gitignored and deliberately not in this repository; wrangler reads secrets
# before vars, so a name in both resolves to the secret. The Slack client id
# is public (it is in the authorize URL) and the redirect base is the tunnel
# a local run is reached on.
#
# `MODEL_KEYS_SECRET` is optional rather than required: with it absent the
# reads still answer, and a connect answers 500 instead of storing a key in
# plaintext. Set it before connecting a model. The key is a bare SHA-256 of
# this value with no key-stretching, so the value *is* the entropy: it must
# be at least 32 bytes of random text (`openssl rand -base64 32`), which
# `validate_config` refuses at build. Rotating it makes every already-stored
# ciphertext undecryptable — the connections have to be re-entered, which is
# the point of a rotate.
#
# Mail (issue #63). `OWLPOST_API_KEY` is a secret (`wrangler secret put
# OWLPOST_API_KEY`); with it absent or blank the adapter reports `not-configured`
# and sends nothing. `MAIL_FROM` is declared below — the sender must be on a
# domain verified in Owlpost, or sends are refused — and `MAIL_REPLY_TO` is
# optional and left unset until there is an address to reply to. The theme every
# mail renders in is `src/mail-theme.json` beside this file, compiled into the
# Worker. Mail leaves as `multipart/alternative` — HTML and its text twin.
[vars]
ENV = "production"
WORKSPACES_SLACK_CLIENT_ID = "replace-with-your-slack-app-client-id"
# The Discord connection (docs/discord.md). The client id is public (it is in
# the install URL); the client secret and the bot token are Worker secrets:
# `wrangler secret put DISCORD_CLIENT_SECRET` and `wrangler secret put
# DISCORD_BOT_TOKEN`, per environment with `--env`. Until real values are set
# the integration reports itself unavailable and the settings page shows nothing.
DISCORD_CLIENT_ID = "replace-with-your-discord-app-client-id"
# The origin this Worker answers on — under `wrangler dev` that is the
# cloudflared tunnel, because Slack must call the callback back over HTTPS.
WORKSPACES_REDIRECT_BASE = "https://replace-with-your-tunnel.trycloudflare.com"
# The origin the device grant (issue #72) builds `verification_uri` under.
# `ModuleConfig` prefixes module config, so the key the grant actually reads
# is `DEVICE_AUTH_API_BASE`, not a bare `API_BASE`; left unset it falls back
# to `https://api.<domain>`, which points a CLI at production from a staging
# or local run. This is the port `wrangler dev` serves, which is plain http
# on loopback.
DEVICE_AUTH_API_BASE = "http://localhost:8787"
# The mail sender. The Worker falls back to this same address when the binding
# is absent, so this line documents the default as much as it sets it.
MAIL_FROM = "Living Brain <hello@livingbrain.wiki>"

# ---------------------------------------------------------------------------
# Deployed environments (issue #93). Wrangler does NOT inherit bindings or
# vars into an environment, so each block below repeats the whole set. The
# ids are PLACEHOLDERS of the same kind as the ones above: the owner replaces
# each with the id `wrangler d1 create livingbrain-staging` or
# `wrangler kv namespace create` prints. Secrets are never in this file —
# they are per environment, set with `wrangler secret put <NAME> --env
# staging` (or `production`), which stores them in Cloudflare and not here.
# docs/deploy.md lists the exact set and the GitHub secrets the workflow
# reads. ---------------------------------------------------------------------------

# Staging: every merge to `main`. A failed smoke test rolls this back.
#
# One host serves both halves: the Worker API (`/v1/*`, `/__health`) and the
# static web app built from `app/` as Workers static assets. A request that
# matches a file there is answered from the assets; everything else reaches the
# Worker. Same origin, so the app's empty `lb-api` meta, its CSP
# `connect-src 'self'` and the session cookie all work without CORS.
[env.staging]
name = "livingbrain-staging"
compatibility_date = "2026-09-01"
routes = [{ pattern = "staging-api.livingbrain.wiki", custom_domain = true }]

# The built app (tools/stamp-assets.mjs, run by `[build]` above), not `app/`
# itself: the pages there name each asset by a hash of its content.
[env.staging.assets]
directory = "../../build/app"

# Not inherited from the top level, so repeated here. Its own namespace, so
# staging traffic never spends production's budget.
[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4002"

[env.staging.ratelimits.simple]
limit = 30
period = 60

[[env.staging.d1_databases]]
binding = "DB"
database_name = "livingbrain-staging"
database_id = "f3a32632-ca97-4038-b094-2a9e1d7f413d"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "livingbrain-blobs-staging"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "333ff8d934b04e87a0c6cb85f9daa572"

# Not inherited from the top level (the `[[migrations]]` above is).
[[env.staging.durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationObject"

# `ENV` is what the harness reads: it names the deployment environment to the
# production readiness gate and binds every cookie this Worker signs, so a
# token minted in staging never verifies in production. `HARNESS_VENTURE` is
# left unset; set it per environment only if the same `HARNESS_SECRET` is ever
# shared with another venture, which nothing here does.
[env.staging.vars]
ENV = "staging"
WORKSPACES_SLACK_CLIENT_ID = "replace-with-your-slack-app-client-id"
DISCORD_CLIENT_ID = "replace-with-your-discord-app-client-id"
WORKSPACES_REDIRECT_BASE = "https://staging-api.livingbrain.wiki"
# The device grant's `verification_uri` (issue #72). Same origin as the host
# above — the API and the app are one Worker, so the approval page the CLI
# sends a person to is served here and carries the session cookie.
DEVICE_AUTH_API_BASE = "https://staging-api.livingbrain.wiki"
# The sending domain verified in Owlpost is `send.livingbrain.wiki` (the same
# one the waitlist mails from), so both senders live there: `MAIL_FROM` for
# the venture's own mail, `WORKSPACES_MAIL_FROM` for the sign-in magic link.
MAIL_FROM = "Living Brain <no-reply@send.livingbrain.wiki>"
WORKSPACES_MAIL_FROM = "Living Brain <no-reply@send.livingbrain.wiki>"

# Production: tags only, and only through the `production` GitHub
# environment's required reviewers (the owner). Same placeholder rule; the
# database and bucket carry no `-staging` suffix.
#
# Hosts: `app.livingbrain.wiki` serves the web app and the API on one origin
# (as staging does), and `mcp.livingbrain.wiki` is the MCP endpoint
# docs/mcp.md names. `api.livingbrain.wiki` is NOT claimed here: it belongs
# to the separate `livingbrain-waitlist` Worker (Livingbrain-wiki/
# waitlist-backend) and its D1, which the site's waitlist form posts to.
# Moving that host onto this Worker would orphan the list, so it is a
# cutover of its own, with the waitlist rows migrated first.
[env.production]
name = "livingbrain"
compatibility_date = "2026-09-01"
routes = [
  { pattern = "app.livingbrain.wiki", custom_domain = true },
  { pattern = "mcp.livingbrain.wiki", custom_domain = true },
]

[env.production.assets]
directory = "../../build/app"

# Not inherited from the top level, so repeated here. Its own namespace, as
# staging has its own, so neither environment spends the other's budget.
[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4003"

[env.production.ratelimits.simple]
limit = 30
period = 60

[[env.production.d1_databases]]
binding = "DB"
database_name = "livingbrain"
database_id = "0b313e30-6dce-424f-8e85-635f2fb24786"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "livingbrain-blobs"

[[env.production.kv_namespaces]]
binding = "KV"
id = "c4a703198a1347c5b62d56f8ce86fd95"

# Not inherited from the top level (the `[[migrations]]` above is).
[[env.production.durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationObject"

[env.production.vars]
ENV = "production"
WORKSPACES_SLACK_CLIENT_ID = "replace-with-your-slack-app-client-id"
DISCORD_CLIENT_ID = "replace-with-your-discord-app-client-id"
WORKSPACES_REDIRECT_BASE = "https://app.livingbrain.wiki"
# The device grant's `verification_uri` (issue #72): production's own origin.
DEVICE_AUTH_API_BASE = "https://app.livingbrain.wiki"
MAIL_FROM = "Living Brain <no-reply@send.livingbrain.wiki>"
WORKSPACES_MAIL_FROM = "Living Brain <no-reply@send.livingbrain.wiki>"
# Coding-agents compiler budget (docs/coding-agents.md): the owner raised it to
# compile the Colonizer backfill (489 colonies) in about a day, not a week.
CODING_AGENTS_DAILY_TOKENS = "3000000"
CODING_AGENTS_MONTHLY_TOKENS = "90000000"
CODING_AGENTS_BATCH = "3"
