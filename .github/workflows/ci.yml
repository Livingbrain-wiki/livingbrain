# fmt, clippy and tests run over everything; the parity matrix runs the
# Cratefield conformance suite for every module crate (SQLite always, Postgres
# against a postgres:16 service); the wasm job builds the Worker, so a
# native-only dependency can never slip into a module. The module list is
# discovered by glob, so a new `crates/livingbrain-*` module needs no edit here.
# `redact-wasm` runs one plain library crate's own tests inside a Worker.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  parity:
    name: parity (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only the postgres leg points the kit at the service container; the
      # sqlite leg leaves it unset, so only that dialect runs there.
      FZ_TEST_POSTGRES_URL: ${{ matrix.dialect == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - name: Conformance for every module crate (${{ matrix.dialect }})
        run: |
          for dir in crates/livingbrain-*/; do
            name=$(basename "$dir")
            # The venture crate is the Worker, not a module; every other
            # livingbrain-* crate mounts a conformance test.
            if [ "$name" = "livingbrain-venture" ]; then continue; fi
            if [ ! -f "$dir/tests/conformance.rs" ]; then continue; fi
            echo "::group::$name (${{ matrix.dialect }})"
            cargo test -p "$name" --test conformance
            echo "::endgroup::"
          done

  app:
    # The app is a static, no-build front end with no npm dependencies, so its
    # tests are Node's built-in runner and nothing else. The pages load the
    # same ES modules under `app/assets/` that the tests import, and `app.js`
    # guards its DOM boot so Node can load it too: these are the functions the
    # browser runs, not copies of them.
    #
    # The glob form of the path is what works on this Node; `node --test
    # app/tests/` (the bare directory) does not.
    name: app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "app/tests/**/*.test.mjs"
      - name: Every app script parses
        run: |
          # sw.js is a classic worker script.
          node --check app/sw.js
          # The three modules, each imported the way a page or a test loads
          # it, so an import-time error fails here and not only in a browser.
          for file in app/assets/markdown.js app/assets/settings.js app/assets/session.js app/assets/app.js; do
            node --input-type=module -e "import('./$file').then(() => process.exit(0))"
          done
      - name: No HTML is ever assigned from content
        # The wiki body is user content and reaches the DOM only as text nodes,
        # so any *assignment* of HTML is a bug. Prose mentions in comments and
        # in the README are matched by the `-n` search too, hence the pattern
        # looks for the call, not the word.
        run: |
          if grep -rnE "\.(inner|outer)HTML *=|insertAdjacentHTML *\(|document\.write *\(" app/; then
            echo "::error::user content must never be assigned as HTML"
            exit 1
          fi

  vendored-stack:
    # The "Built with" list is a vendored copy of the registry entry for this
    # venture: nothing fetches it at runtime, so it can only go stale silently.
    # This job fails the build when the vendored copy drifts from the published
    # registry. It is the one job that does reach the network, which is why it
    # lives beside `app` (the other non-Rust job) and not among the crate jobs.
    # Python is pinned like every other toolchain here; the script uses only the
    # standard library, so there is nothing to install.
    name: vendored stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/check-vendored-stack.sh

  redact-wasm:
    # The redaction library runs in the Worker, so its tests run in one. The
    # wasm-bindgen CLI version is read from the lockfile rather than pinned
    # again here: the runner refuses a wasm-bindgen whose version does not
    # match the `wasm-bindgen` in the crate graph, and a second version in
    # this file is a second thing to forget to update.
    name: redact (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install the wasm-bindgen runner (version from Cargo.lock)
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p}' Cargo.lock)
          echo "wasm-bindgen $version"
          cargo install -q --locked wasm-bindgen-cli --version "$version"
      - name: Test livingbrain-redact in a Worker
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p livingbrain-redact --target wasm32-unknown-unknown

  wasm:
    name: worker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the Worker and assert the shim
        working-directory: crates/livingbrain-venture
        run: |
          cargo install -q --locked worker-build
          worker-build --release
          test -f build/worker/shim.mjs
